<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div aria-live="polite">
    <p id="notice" hidden></p>
    <section id="result" hidden>
      <p><strong>Тема:</strong> <span id="topic"></span></p>
      <p><strong>Черновик ответа</strong> (проверьте перед отправкой клиенту):</p>
      <pre id="draft"></pre>
    </section>
  </div>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const notice = document.querySelector("#notice");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function showNotice(message) {
      notice.textContent = message;
      notice.hidden = !message;
    }

    function clearResult() {
      topic.textContent = "";
      draft.textContent = "";
      result.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      showNotice("Разбираем заявку…");
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const body = await reply.json();
        if (body.status === "ready") {
          topic.textContent = TOPIC_LABELS[body.topic] ?? body.topic;
          draft.textContent = body.draft;
          result.hidden = false;
          showNotice("");
        } else if (body.status === "manual_review") {
          showNotice("Не удалось автоматически разобрать заявку. Определите тему и подготовьте ответ вручную.");
        } else if (body.status === "invalid_input") {
          showNotice("Введите текст заявки.");
        } else {
          showNotice("Сервис временно недоступен. Попробуйте ещё раз или обработайте заявку вручную.");
        }
      } catch {
        showNotice("Сервис временно недоступен. Попробуйте ещё раз или обработайте заявку вручную.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
